name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unsupported-bun-boundary:
    name: Unsupported Bun 1.3.13 fails closed / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun -e 'if (Bun.version !== "1.3.13") { console.error(Bun.version); process.exit(1) }'
      - run: bun ./scripts/run-repository-test-gate.ts ./test/runtime-compatibility.test.ts
        env:
          PCBOO_RUNTIME_COMPAT_EXPECT: unsupported-1.3.13
      - name: Root prepack rejects unsupported Bun specifically
        run: bun -e 'const p=Bun.spawnSync({cmd:[process.execPath,"pm","pack","--dry-run"],stdout:"pipe",stderr:"pipe"}); const output=new TextDecoder().decode(p.stdout)+new TextDecoder().decode(p.stderr); if(p.exitCode===0||!output.includes("PCBOO_RUNTIME_UNSUPPORTED_BUN_001")){console.error(output);process.exit(1)}'
      - name: Creator prepack rejects unsupported Bun specifically
        working-directory: packages/create-pcboo
        run: bun -e 'const p=Bun.spawnSync({cmd:[process.execPath,"pm","pack","--dry-run"],stdout:"pipe",stderr:"pipe"}); const output=new TextDecoder().decode(p.stdout)+new TextDecoder().decode(p.stderr); if(p.exitCode===0||!output.includes("PCBOO_RUNTIME_UNSUPPORTED_BUN_001")){console.error(output);process.exit(1)}'

  test:
    name: Bun 1.3.14 / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:regular
      - run: bun run test:heavy:accept-tscircuit-upgrade
      - run: bun run test:heavy:artifact-manifest
      - run: bun run test:heavy:manufacturing-properties
      - run: bun run test:heavy:semantic-properties
      - run: bun run test:heavy:manufacturing-verify
      - run: bun run test:heavy:production-promotion
      - run: bun run test:heavy:scaffold
      - run: bun run test:heavy:server
      - name: Performance qualification
        id: performance
        run: bun run test:performance
      - name: Validate performance report
        id: performance_report
        run: bun run performance:validate
      - name: Upload performance qualification
        if: ${{ success() && steps.performance.outcome == 'success' && steps.performance_report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ runner.os }}-${{ runner.arch }}
          path: .pcboo-ci/performance-*.json
          if-no-files-found: error

  cli-integration:
    name: Isolated CLI integration / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:cli

  package-distribution:
    name: Package distributions / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun pm pack --dry-run
      - run: bun pm pack --dry-run
        working-directory: packages/create-pcboo
      - run: bun run test:packed

  runtime-evidence:
    name: Tscircuit runtime evidence / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build a physically separate packed consumer and retain its root
        env:
          PCBOO_PACKED_CONSUMER_ROOT_OUTPUT: ${{ runner.temp }}/pcboo-packed-root.txt
          PCBOO_PACKED_PREPARE_ONLY: "1"
        run: bun run test:packed
      - name: Authenticate repository and packed-consumer runtime profiles
        run: |
          packed_root="$(cat "$RUNNER_TEMP/pcboo-packed-root.txt")"
          mkdir -p .pcboo-ci
          bun run qualify:tscircuit-runtime --repository-root "$GITHUB_WORKSPACE" --packed-consumer-root "$packed_root" --output .pcboo-ci/tscircuit-runtime-darwin-arm64.json
      - name: Upload exact runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tscircuit-runtime-darwin-arm64
          path: .pcboo-ci/tscircuit-runtime-darwin-arm64.json
          if-no-files-found: error

  ngspice-live:
    name: Live ngspice qualification / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install current qualified ngspice formula
        run: brew install ngspice
      - name: Run live qualification
        env:
          PCBOO_LIVE_NGSPICE_REQUIRED: "1"
        run: bun run test:live:ngspice
      - name: Upload exact live qualification evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngspice-live-${{ runner.os }}-${{ runner.arch }}
          path: .pcboo-ci/ngspice-live-*
          if-no-files-found: error

  kicad-live:
    name: Live KiCad 10 qualification / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install exact official KiCad 10.0.5 distribution
        env:
          KICAD_DMG_URL: https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.5/kicad-unified-universal-10.0.5.dmg
          KICAD_DMG_SHA256: 9399e18609c6b94e708b375bb88455b94c55653ec427b81023d71ae42217d681
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/kicad.dmg" "$KICAD_DMG_URL"
          echo "$KICAD_DMG_SHA256  $RUNNER_TEMP/kicad.dmg" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/kicad-mount"
          hdiutil attach "$RUNNER_TEMP/kicad.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/kicad-mount"
          sudo mkdir -p /Applications/KiCad
          sudo ditto "$RUNNER_TEMP/kicad-mount/KiCad/KiCad.app" /Applications/KiCad/KiCad.app
          hdiutil detach "$RUNNER_TEMP/kicad-mount"
          mkdir "$RUNNER_TEMP/kicad-preflight-home"
          HOME="$RUNNER_TEMP/kicad-preflight-home" TMPDIR="$RUNNER_TEMP/kicad-preflight-home" LC_ALL=C LANG=C \
            /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli version
      - name: Run live two- and four-layer KiCad qualification
        run: bun run test:live:kicad
      - name: Upload exact live KiCad evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kicad-live-${{ runner.os }}-${{ runner.arch }}
          path: .pcboo-ci/kicad-live-darwin-arm64
          if-no-files-found: error
