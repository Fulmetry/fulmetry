name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish matching Fulmetry packages / macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0
      - name: Require synchronized versions matching the immutable tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e '
            const tag = process.env.RELEASE_TAG ?? "";
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) throw new Error(`Invalid release tag ${tag}`);
            const version = tag.slice(1);
            const framework = await Bun.file("package.json").json();
            const creator = await Bun.file("packages/create-fulmetry/package.json").json();
            if (framework.name !== "fulmetry" || creator.name !== "create-fulmetry") {
              throw new Error(`Unexpected package identities ${framework.name} and ${creator.name}`);
            }
            if (framework.version !== version || creator.version !== version) {
              throw new Error(`Tag ${tag} does not match fulmetry@${framework.version} and create-fulmetry@${creator.version}`);
            }
          '
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:packed
      - name: Refuse an incomplete or duplicate registry release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "fulmetry@$version" version >/dev/null 2>&1; then
            echo "fulmetry@$version already exists; refusing to republish or continue partially." >&2
            exit 1
          fi
          if npm view "create-fulmetry@$version" version >/dev/null 2>&1; then
            echo "create-fulmetry@$version already exists; refusing to republish or continue partially." >&2
            exit 1
          fi
      - name: Publish framework with OIDC provenance
        run: npm publish --access public --provenance
      - name: Publish initializer with OIDC provenance
        working-directory: packages/create-fulmetry
        run: npm publish --access public --provenance
